name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Publish APK
        run: >-
          dotnet publish FModel.Android/FModel.Android.csproj
          -c Release
          -f net8.0-android34.0
          -o artifacts/android-apk
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory=$ANDROID_HOME
          -p:JavaSdkDirectory=$JAVA_HOME
          -v:n

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmodel-android-apk
          path: artifacts/android-apk/*.apk
          if-no-files-found: error
